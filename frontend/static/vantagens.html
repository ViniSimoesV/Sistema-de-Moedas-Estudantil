<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Vantagens - UniRewards</title>
    <link rel="icon" href="../assets/Lumen.png" style="width: 15px; height: 2px;" type="image/png">
    
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/perfil.css">
    <link rel="stylesheet" href="../css/energia.css">
    <link rel="stylesheet" href="../css/modal.css">
    <link rel="stylesheet" href="../css/vantagem.css">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<body class="perfil-page">

    <canvas id="energyCanvas"></canvas>
    <div id="navbar"></div>

    <main class="perfil-container vantagens-main-container">
        <section class="vantagens-section">
            <div class="content-card glass">
                <header class="vantagens-header header-flex">
                    <h4 class="module-title title-no-border">Catálogo de Vantagens</h4>
                    <div class="actions-group">
                        <button id="btnNovaVantagem" class="btn btn-confirmar">
                            <span class="material-symbols-outlined">add_circle</span>
                            Nova Vantagem
                        </button>
                    </div>
                </header>
                
                <div id="listaVantagens" class="vantagens-grid"> </div>
            </div>
        </section>
    </main>

    <!-- Modal Adicionar/Editar Vantagem -->
    <div id="modalVantagem" class="modal-overlay">
        <div class="modal-content glass">
            <div class="modal-header">
                <h4 class="module-title" id="modalVantagemTitulo">Adicionar Vantagem</h4>
            </div>
            <form id="formVantagem">
                <input type="hidden" id="vantagemId">
                <div class="modal-body">
                    <div class="input-group">
                        <label>Nome do Produto/Serviço</label>
                        <input type="text" id="vantagemNome" required>
                    </div>
                    <div class="input-group">
                        <label>Descrição detalhada</label>
                        <textarea id="vantagemDesc" rows="3" class="textarea-dark" required></textarea>
                    </div>
                    <div class="form-grid-2">
                        <div class="input-group">
                            <label>Custo em Lúmens</label>
                            <input type="number" id="vantagemCusto" min="1" required>
                        </div>
                        <div class="input-group">
                            <label>Foto (Arquivo ou URL)</label>
                            <input type="file" id="vantagemFotoFile" accept="image/*" style="margin-bottom: 8px;">
                            <input type="text" id="vantagemFotoUrl" class="textarea-dark" style="height: 40px; resize: none;" placeholder="Ou cole o link da imagem...">
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-cancelar" id="btnFecharModalVantagem">Cancelar</button>
                    <button type="submit" class="btn btn-confirmar">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal de Confirmação para Exclusão de Vantagem -->
    <div id="modalExcluirVantagem" class="modal-overlay">
        <div class="modal-content glass" style="max-width: 400px; text-align: center;">
            <div class="modal-body" style="padding: 2rem 1rem;">
                <span class="material-symbols-outlined" style="font-size: 4rem; color: #ff4d4d; margin-bottom: 1rem;">warning</span>
                <h4 style="margin-bottom: 1rem;">Tem certeza?</h4>
                <p style="color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 2rem;">
                    A vantagem será removida da loja e os alunos não poderão mais resgatá-la. Esta ação não pode ser desfeita.
                </p>
                <div style="display: flex; gap: 1rem; justify-content: center;">
                    <button class="btn btn-cancelar" onclick="document.getElementById('modalExcluirVantagem').classList.remove('active')">Cancelar</button>
                    <button class="btn" id="btnConfirmarExclusao" style="background: #ff4d4d; color: white;">Sim, Remover</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="../js/vantagensEmpresa.js" defer></script>
    <script src="../js/navbarEmpresa.js" defer></script>
    <script src="../js/energia.js" defer></script>
</body>
</html>
