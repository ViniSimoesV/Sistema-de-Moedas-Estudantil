spring.application.name=UniRewards

# URL com SSL Obrigatório e KeepAlive para redes instáveis
spring.datasource.url=jdbc:postgresql://aws-1-sa-east-1.pooler.supabase.com:6543/postgres?prepareThreshold=0
spring.datasource.username=postgres.logixvrbnxyuklwwouad
spring.datasource.password=${DB_PASSWORD:sZ6fiH2e2gEMdo79}

# Hibernate - Configurações para PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none

# Configuração da Porta
server.port=${PORT:8080}
server.address=0.0.0.0

# HikariCP - Configurações para melhorar a estabilidade em redes instáveis
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.minimum-idle=1

# ===============================
# CONFIGURAÇÕES DO RABBITMQ
# ===============================
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASS:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
spring.rabbitmq.ssl.enabled=true

# ===============================
